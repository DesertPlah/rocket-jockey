      const can = k === 'U' ? player.alt < 2 : player.alt > 0;
      ctx.fillStyle = 'rgba(180,140,255,' + (held ? 0.45 : can ? 0.15 : 0.05) + ')'; ctx.strokeStyle = 'rgba(180,140,255,' + (can ? 0.75 : 0.3) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
      const d = k === 'U' ? -1 : 1, a = 'rgba(255,255,255,' + (can ? 0.9 : 0.3) + ')';
      ctx.fillStyle = a; ctx.beginPath(); ctx.moveTo(b.x, b.y + d * 13 * sc); ctx.lineTo(b.x - 10 * sc, b.y - d * 1 * sc); ctx.lineTo(b.x + 10 * sc, b.y - d * 1 * sc); ctx.closePath(); ctx.fill();
      txt(k === 'U' ? 'UP' : 'DN', b.x, b.y - d * 9 * sc, 10 * sc, a, 'center', false);
      if (k === 'U') txt(ALT_NAMES[lvl(player)] || '', b.x, (btns.U.y + btns.D.y) / 2, 11 * sc, '#c9b0ff', 'center');
      continue;
    }
    let col = k === 'B' ? '255,170,51' : k === 'T' ? '255,150,50' : '0,255,255';
    if (k === 'L' && player.cables[0] && player.cables[0].state === 'latched') col = '255,255,255';
    if (k === 'R' && player.cables[1] && player.cables[1].state === 'latched') col = '255,255,255';
    const off = dim && k !== 'T' && (k === 'B' ? !player.onRocket : true);
    const pulse = k === 'T' ? 0.25 + 0.25 * Math.sin(now / 90) : 0;
    ctx.fillStyle = 'rgba(' + col + ',' + (off ? 0.05 : (held ? 0.45 : 0.15) + pulse) + ')';
    ctx.strokeStyle = 'rgba(' + col + ',' + (off ? 0.25 : 0.7) + ')'; ctx.lineWidth = k === 'T' ? 3 : 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    const lab = k === 'L' ? '<L' : k === 'R' ? 'R>' : k === 'T' ? 'TIE' : 'BOOST';
    txt(lab, b.x, b.y, (k === 'B' ? 12 : k === 'T' ? 18 : 20) * sc, off ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.9)', 'center', false);
  }
}
function drawBigTitle(text, x, y, size) {
  ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  for (let i = 5; i >= 1; i--) { ctx.fillStyle = i > 2 ? '#400' : '#900'; ctx.fillText(text, x + i * d * 0.6, y + i * d * 0.6); }
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, '#fff7a0'); g.addColorStop(0.45, '#ffcc00'); g.addColorStop(0.55, '#ff7700'); g.addColorStop(1, '#ff3300');

}
function drawTitle(now) {
  ctx.fillStyle = 'rgba(0,0,10,0.55)'; ctx.fillRect(0, 0, VW, VH);
  const size = Math.min(VW / 9, VH / 5, 90);
  drawBigTitle('ROCKET JOCKEY', VW / 2, VH * 0.27, size);
  const sc = clamp(VH / 390, 0.8, 1.6);
  txt('v0.9  ROCKET WAR', VW / 2, VH * 0.27 + size * 0.75, 14 * sc, '#0ff', 'center');
  txt('Grapple posts to whip around corners.', VW / 2, VH * 0.52, 14 * sc, '#ccc', 'center');
  txt('Hit the RIDER to yank them off; hook a NOSE or TAIL to tow!', VW / 2, VH * 0.52 + 18 * sc, 14 * sc, '#ccc', 'center');
  txt('Hook two things, then TIE them: clotheslines, tie-ups!', VW / 2, VH * 0.52 + 36 * sc, 14 * sc, '#f93', 'center');
  txt(isTouch ? 'LEFT: steer   RIGHT: hold <L  R> cables + BOOST' : 'ARROWS/WASD steer  SHIFT/W boost  Q/E cables  T tie', VW / 2, VH * 0.52 + 58 * sc, 12 * sc, '#8ab', 'center');
  txt('SCORING: KO +' + PTS_KO + '  CLOTHESLINE +' + PTS_CLOTHES + '  BIND +' + PTS_BIND + '  TIE/ANCHOR +' + PTS_TIE + '  HOOK +' + PTS_HOOK + '  COMBO +' + PTS_COMBO + '  DRAG +1/' + DRAG_EVERY + 's  PICKUP +' + PTS_PICKUP + '  FALL -' + PTS_FALL,
    VW / 2, VH * 0.52 + 75 * sc, 9.5 * sc, '#9c9', 'center', false);
  if (ALTITUDE_ENABLED) txt(isTouch ? 'UP / DN: altitude (cables reach 1 level; LOW fences only stop LOW)' : 'R / F: altitude (cables reach 1 level; LOW fences only stop LOW)', VW / 2, VH * 0.52 + 75 * sc, 12 * sc, '#b9a0ff', 'center');
  if (Math.floor(now / 500) % 2 === 0) txt(isTouch ? 'TAP TO START' : 'CLICK OR PRESS SPACE TO START', VW / 2, VH * 0.9, 22 * sc, '#fff', 'center');
}
function drawResults(now) {
  ctx.fillStyle = 'rgba(0,0,10,0.75)'; ctx.fillRect(0, 0, VW, VH);
  const sc = clamp(VH / 390, 0.8, 1.6);
  drawBigTitle('ROUND OVER', VW / 2, VH * 0.14, Math.min(VW / 10, 46 * sc));
  const place = results.indexOf(player) + 1;
  const tie = results.length > 1 && results[0].score === results[1].score && results[0].falls === results[1].falls && place <= 2;
  const ord = ['1ST', '2ND', '3RD', '4TH'][place - 1];
  txt(place === 1 && !tie ? 'YOU WIN!' : tie ? 'TIE FOR 1ST!' : 'YOU PLACED ' + ord, VW / 2, VH * 0.29, 22 * sc, place === 1 ? '#fc0' : '#fff', 'center');
  const cx = VW / 2, rowH = 26 * sc; let y = VH * 0.41;
  const cols = [['RANK', -250, 'left'], ['RIDER', -170, 'left'], ['POINTS', 60, 'right'], ['KOs', 130, 'right'], ['TRICKS', 225, 'right'], ['FALLS', 305, 'right']];
  for (const c of cols) txt(c[0], cx + c[1] * sc, y, 13 * sc, '#888', c[2]);
  y += rowH;
  results.forEach((r, i) => {
    const vals = [(i + 1) + '.', r.name, String(r.score), String(r.kos), String(r.tricks), String(r.falls)];
    cols.forEach((c, j) => txt(vals[j], cx + c[1] * sc, y, (j === 2 ? 18 : 16) * sc, r.color, c[2]));
    y += rowH;

  if (overT > 1.2 && Math.floor(now / 500) % 2 === 0) txt(isTouch ? 'TAP TO RESTART' : 'CLICK OR SPACE TO RESTART', VW / 2, VH * 0.9, 20 * sc, '#fff', 'center');
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  const portrait = VH > VW;
  if (!portrait) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; }
    if (n === 8) acc = 0;
  }
  render(now);
  requestAnimationFrame(frame);
}
resetWorld();
requestAnimationFrame(frame);

  get gameT() { return gameT; }, get results() { return results; }, endRound, doTie, startGame,

  PU: { POWERUP_MAX, POWERUP_RESPAWN, POWERUP_CLEAR, LONG_CABLE_MULT, LONG_CABLE_TIME, GRIP_TIME, TURBO_MULT, TURBO_TIME, CABLE_MAX, BASE_SPEED },
  AI: { AI_ERR, AI_REACT, AI_RETARGET, AI_FIRE_COOL, AI_HOLD_POST, AI_TIE_CHANCE, AI_POST_RANGE, AI_HOOK_FRAC, AI_PLAYER_BIAS, AI_SEEK_POST, AI_ZONE_YANK, AI_PU_CHANCE, AI_PU_RANGE } };
