<script>
(() => {
'use strict';

// ---------- setup ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);

const BASE_SPEED = 220, BOOST_SPEED = 400, TURN_RATE = 2.7, GRIP = 2.4; // GRIP: velocity->heading pull while swinging on a post (v0.6 feel)

const ALTITUDE_ENABLED = false || /[?&]alt=1(&|$)/.test(location.search);

// ---------- PWA bits (inline manifest + generated icon) ----------

} catch (e) { /* non-fatal */ }

// ---------- audio ----------
let AC = null, eng = null;

}

}
const sfx = {
  fire() { beep(700, 0.09, 'square', 0.05, 1500); },
  latch() { beep(260, 0.07, 'triangle', 0.12); beep(520, 0.05, 'square', 0.04); },
  knock() { noise(0.45, 0.3, 600); beep(700, 0.45, 'sawtooth', 0.08, 70); },
  wall() { beep(110, 0.12, 'square', 0.07, 60); },

  spawn() { beep(300, 0.25, 'triangle', 0.08, 900); },
  start() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.06), i * 90)); },
  end() { [880, 659, 554, 440, 330].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.06), i * 140)); },
};
let lastWallSfx = 0;

// ---------- v0.3 constants / extra sounds ----------
const FOOT_SPEED = 62;          // ~28% of rocket cruise speed
const TUMBLE_TIME = 0.7;        // seconds tumbling before you can run
const REMOUNT_INV = 1.5;        // blinking invulnerability after remount
const RECALL_TIME = 15;         // on foot this long -> rocket flies back to you
const TETHER_LIFE = 20, TIE_EFFECT = 6, TETHER_MAX = 4, TIE_COOL = 1.2;
sfx.tie = () => { // rope creak + knot
  beep(140, 0.18, 'triangle', 0.12, 95); setTimeout(() => beep(170, 0.16, 'triangle', 0.1, 110), 120);
  setTimeout(() => { noise(0.08, 0.3, 1500); beep(900, 0.05, 'square', 0.05); }, 260);
};
sfx.twang = () => { beep(220, 0.5, 'sawtooth', 0.12, 55); beep(1400, 0.12, 'square', 0.05, 600); noise(0.12, 0.25, 2000); };
sfx.release = () => { beep(900, 0.1, 'square', 0.05, 300); noise(0.06, 0.15, 2500); };
sfx.runover = () => { beep(500, 0.08, 'square', 0.06, 900); setTimeout(() => beep(900, 0.08, 'square', 0.05, 500), 70); };

// ---------- world ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const posts = [];
(function makePosts() {
  const r = mulberry(1996);
  const cols = 6, rows = 4;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = (i + 0.5) * WORLD_W / cols + (r() - 0.5) * 260;
    const y = (j + 0.5) * WORLD_H / rows + (r() - 0.5) * 220;
    posts.push({ x, y, r: 14 + r() * 10, ph: r() * TAU });
  }
})();
// fences: straight wall pieces. LOW fences block only riders at LOW (and anything on the ground);
// TALL fences block every altitude. Cables are blocked the same way (by the cable owner's altitude).
const fences = [];
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; u = clamp(u, 0, 1);
  return hyp(px - ax - u * dx, py - ay - u * dy);
}

  const d = (x2 - x1) * (y4 - y3) - (y2 - y1) * (x4 - x3); if (d === 0) return false;
  const u = ((x3 - x1) * (y4 - y3) - (y3 - y1) * (x4 - x3)) / d, v = ((x3 - x1) * (y2 - y1) - (y3 - y1) * (x2 - x1)) / d;
  return u >= 0 && u <= 1 && v >= 0 && v <= 1;
}
(function makeFences() {
  const r = mulberry(1997);
  const types = [false, true, false, true, false, true, false, true]; // 4 low, 4 tall
  for (const tall of types) {
    for (let k = 0; k < 400; k++) {
      const cx = 350 + r() * (WORLD_W - 700), cy = 350 + r() * (WORLD_H - 700);
      const q = r(), a = q < 0.4 ? 0 : q < 0.8 ? Math.PI / 2 : (q < 0.9 ? 1 : -1) * Math.PI / 4;
      const len = 220 + r() * 160, dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
      const f = { x1: cx - dx, y1: cy - dy, x2: cx + dx, y2: cy + dy, tall };
      if (posts.some(p => segDist(p.x, p.y, f.x1, f.y1, f.x2, f.y2) < p.r + 60)) continue;
      let ok = true;
      for (const g of fences) for (let i = 0; i <= 4 && ok; i++) {
        const sx = f.x1 + (f.x2 - f.x1) * i / 4, sy = f.y1 + (f.y2 - f.y1) * i / 4;
        if (segDist(sx, sy, g.x1, g.y1, g.x2, g.y2) < 160) ok = false;

function fenceBlocks(f, level) { return !ALTITUDE_ENABLED || f.tall || level <= 0; } // level -1 = ground, 0 = LOW

    let u = clamp(((o.x - f.x1) * ex + (o.y - f.y1) * ey) / l2, 0, 1);
    const cx = f.x1 + u * ex, cy = f.y1 + u * ey;
    let nx, ny;
    const px = o.px == null ? o.x : o.px, py = o.py == null ? o.y : o.py;
    if (segsCross(px, py, o.x, o.y, f.x1, f.y1, f.x2, f.y2)) { // tunnelled through: push back to the side we came from
      const side = Math.sign(ex * (py - f.y1) - ey * (px - f.x1)) || 1;

  { name: 'YOU', color: '#33ccff' },
  { name: 'RED', color: '#ff4444' },
  { name: 'GREEN', color: '#44ff44' },
  { name: 'GOLD', color: '#ffdd33' },
];
let riders = [], player = null;
const tethers = [];
function makeRider(i) {
  const d = RIDER_DEFS[i];
  return {
    id: i, name: d.name, color: d.color, isPlayer: i === 0,
    x: 0, y: 0, vx: 0, vy: 0, px: 0, py: 0, ang: 0, onRocket: true, inv: 0, stun: 0,
    fuel: FUEL_MAX, boosting: false, score: 0, falls: 0, cables: [null, null], cableCool: 0,
    // the rocket is its own object; while riding it just follows the rider
    rk: { x: 0, y: 0, vx: 0, vy: 0, ang: 0, spin: 0, homing: false },
    tumble: 0, footT: 0, hitCool: 0, walk: 0, spin: 0, killer: null, alt: 1, altV: 1,

  for (const r of riders) { if (r.isPlayer) continue; txt(r.name + ' ' + r.score + (r.onRocket ? (ALTITUDE_ENABLED ? ' [' + 'LMH'[lvl(r)] + ']' : '') : ' (on foot)'), 12, yy, 12 * sc, r.color); yy += 15 * sc; }
  // timer
  const t = Math.ceil(timeLeft), mm = Math.floor(t / 60), ss = t % 60;
  txt(mm + ':' + (ss < 10 ? '0' : '') + ss, VW / 2, 20 * sc, 26 * sc, t <= 30 ? '#f44' : '#fff', 'center');
  // messages
  let my = 50 * sc;
  for (const m of msgs) { ctx.globalAlpha = clamp(m.t, 0, 1); txt(m.text, VW / 2, my, 16 * sc, m.color, 'center'); my += 20 * sc; }
  ctx.globalAlpha = 1;
  // on foot prompt
  if (!player.onRocket) {
    if (Math.floor(now / 350) % 2 === 0 || player.tumble > 0) txt('GET BACK ON YOUR ROCKET!', VW / 2, VH * 0.36, 24 * sc, '#3cf', 'center');
    let sub = player.tumble > 0 ? 'KNOCKED OFF!' : tiedDown(player) ? 'TIED UP! WAIT IT OUT...' : 'RUN TO IT';
    if (player.rk.homing) sub = 'ROCKET RETURNING...';
    else if (player.footT > 5) sub += '   (RECALL IN ' + Math.max(1, Math.ceil(RECALL_TIME - player.footT)) + ')';
    txt(sub, VW / 2, VH * 0.36 + 26 * sc, 14 * sc, '#fff', 'center');
  } else if (canTie()) {
    txt('BOTH CABLES HOOKED: ' + (isTouch ? 'TAP TIE!' : 'PRESS T TO TIE!'), VW / 2, VH * 0.3, 16 * sc, Math.floor(now / 200) % 2 ? '#f93' : '#fff', 'center');
  }
  drawMinimap(sc);
  if (isTouch) drawTouch(sc, now);
  else txt(player.onRocket ? 'ARROWS/WASD steer  SHIFT/W boost  Q/E cables (hold)  T tie' + (ALTITUDE_ENABLED ? '  R/F altitude' : '') : 'ARROWS/WASD run to your rocket', VW / 2, VH - 14, 12, '#678', 'center', false);
}
function drawMinimap(sc) {
  const w = 130 * sc, h = w * WORLD_H / WORLD_W, x = VW - w - 10, y = 10;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#fc0'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  const k = w / WORLD_W;
  ctx.fillStyle = '#0aa';
  for (const p of posts) ctx.fillRect(x + p.x * k - 1, y + p.y * k - 1, 2, 2);
  for (const f of fences) { ctx.strokeStyle = f.tall ? '#ccd' : '#c8873e'; ctx.lineWidth = f.tall ? 2.5 : 1.5; ctx.beginPath(); ctx.moveTo(x + f.x1 * k, y + f.y1 * k); ctx.lineTo(x + f.x2 * k, y + f.y2 * k); ctx.stroke(); }
  ctx.strokeStyle = '#f93'; ctx.lineWidth = 1.5;
  for (const t of tethers) { const A = anchorObj(t.a), B = anchorObj(t.b); ctx.beginPath(); ctx.moveTo(x + A.x * k, y + A.y * k); ctx.lineTo(x + B.x * k, y + B.y * k); ctx.stroke(); }
  for (const r of riders) {
    if (!r.onRocket) { ctx.fillStyle = '#777'; ctx.fillRect(x + r.rk.x * k - 1.5, y + r.rk.y * k - 1.5, 3, 3); }
    ctx.fillStyle = r.onRocket ? r.color : '#888';
    const sz = r.isPlayer ? 5 : 4;
    ctx.fillRect(x + r.x * k - sz / 2, y + r.y * k - sz / 2, sz, sz);
  }
  const s = cam.scale;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + (cam.x - VW / 2 / s) * k, y + (cam.y - VH / 2 / s) * k, VW / s * k, VH / s * k);
}
function drawTouch(sc, now) {
  const bx = stick.active ? stick.ox : stickHome.x, by = stick.active ? stick.oy : stickHome.y, R = stickHome.r;
  if (!player.onRocket) {
    // on foot: plain round direction pad labelled RUN
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, R, 0, TAU); ctx.fill(); ctx.stroke();
    const kx = bx + (stick.active ? stick.fx * R : 0), ky = by + (stick.active ? stick.fy * R : 0);
    ctx.fillStyle = 'rgba(51,204,255,0.5)'; ctx.beginPath(); ctx.arc(kx, ky, R * 0.4, 0, TAU); ctx.fill();
    txt('RUN', bx, by - R - 11 * sc, 11 * sc, 'rgba(255,255,255,0.6)', 'center', false);
  } else {
    // horizontal handlebar slider
    const kr = R * 0.36, hw = R + kr, hh = kr * 1.15;
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx - hw + hh, by - hh); ctx.lineTo(bx + hw - hh, by - hh);
    ctx.arc(bx + hw - hh, by, hh, -Math.PI / 2, Math.PI / 2); ctx.lineTo(bx - hw + hh, by + hh);
    ctx.arc(bx - hw + hh, by, hh, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    const h = stick.active ? stick.h : 0, kx = bx + h * R;
    if (Math.abs(h) > 0.01) { // fill bar from center to knob = turn amount
      ctx.fillStyle = 'rgba(51,204,255,0.35)'; ctx.fillRect(Math.min(bx, kx), by - hh * 0.45, Math.abs(kx - bx), hh * 0.9);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(bx - 1, by - hh * 0.7, 2, hh * 1.4); // center tick
    for (const d of [-1, 1]) { // arrows
      const ax = bx + d * (hw + 10 * sc), lit = h * d > 0.08;
      ctx.fillStyle = lit ? 'rgba(51,204,255,0.95)' : 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.moveTo(ax + d * 9 * sc, by); ctx.lineTo(ax, by - 8 * sc); ctx.lineTo(ax, by + 8 * sc); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(51,204,255,0.6)'; ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(kx, by, kr, 0, TAU); ctx.fill(); ctx.stroke();
    txt('STEER', bx, by - hh - 11 * sc, 11 * sc, 'rgba(255,255,255,0.55)', 'center', false);
  }
  // buttons
  const dim = !player.onRocket || player.cableCool > 0;
  for (const k in btns) {
    if (!btnEnabled(k)) continue;
    const b = btns[k], held = heldBtn(k);
    if (k === 'U' || k === 'D') {
      const can = k === 'U' ? player.alt < 2 : player.alt > 0;
      ctx.fillStyle = 'rgba(180,140,255,' + (held ? 0.45 : can ? 0.15 : 0.05) + ')'; ctx.strokeStyle = 'rgba(180,140,255,' + (can ? 0.75 : 0.3) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
      const d = k === 'U' ? -1 : 1, a = 'rgba(255,255,255,' + (can ? 0.9 : 0.3) + ')';
      ctx.fillStyle = a; ctx.beginPath(); ctx.moveTo(b.x, b.y + d * 13 * sc); ctx.lineTo(b.x - 10 * sc, b.y - d * 1 * sc); ctx.lineTo(b.x + 10 * sc, b.y - d * 1 * sc); ctx.closePath(); ctx.fill();
      txt(k === 'U' ? 'UP' : 'DN', b.x, b.y - d * 9 * sc, 10 * sc, a, 'center', false);
      if (k === 'U') txt(ALT_NAMES[lvl(player)] || '', b.x, (btns.U.y + btns.D.y) / 2, 11 * sc, '#c9b0ff', 'center');
      continue;
    }
    let col = k === 'B' ? '255,170,51' : k === 'T' ? '255,150,50' : '0,255,255';
    if (k === 'L' && player.cables[0] && player.cables[0].state === 'latched') col = '255,255,255';
    if (k === 'R' && player.cables[1] && player.cables[1].state === 'latched') col = '255,255,255';
    const off = dim && k !== 'T' && (k === 'B' ? !player.onRocket : true);
    const pulse = k === 'T' ? 0.25 + 0.25 * Math.sin(now / 90) : 0;
    ctx.fillStyle = 'rgba(' + col + ',' + (off ? 0.05 : (held ? 0.45 : 0.15) + pulse) + ')';
    ctx.strokeStyle = 'rgba(' + col + ',' + (off ? 0.25 : 0.7) + ')'; ctx.lineWidth = k === 'T' ? 3 : 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
    const lab = k === 'L' ? '<L' : k === 'R' ? 'R>' : k === 'T' ? 'TIE' : 'BOOST';
    txt(lab, b.x, b.y, (k === 'B' ? 12 : k === 'T' ? 18 : 20) * sc, off ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.9)', 'center', false);
  }
}
function drawBigTitle(text, x, y, size) {
  ctx.font = 'bold ' + size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const d = Math.max(2, size / 14);
  for (let i = 5; i >= 1; i--) { ctx.fillStyle = i > 2 ? '#400' : '#900'; ctx.fillText(text, x + i * d * 0.6, y + i * d * 0.6); }
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, '#fff7a0'); g.addColorStop(0.45, '#ffcc00'); g.addColorStop(0.55, '#ff7700'); g.addColorStop(1, '#ff3300');
  ctx.fillStyle = g; ctx.fillText(text, x, y);
  ctx.lineWidth = Math.max(1.5, size / 30); ctx.strokeStyle = '#000'; ctx.strokeText(text, x, y);
}
function drawTitle(now) {
  ctx.fillStyle = 'rgba(0,0,10,0.55)'; ctx.fillRect(0, 0, VW, VH);
  const size = Math.min(VW / 9, VH / 5, 90);
  drawBigTitle('ROCKET JOCKEY', VW / 2, VH * 0.27, size);
  const sc = clamp(VH / 390, 0.8, 1.6);
  txt('v0.6.1  ROCKET WAR', VW / 2, VH * 0.27 + size * 0.75, 14 * sc, '#0ff', 'center');
  txt('Grapple posts to whip around corners.', VW / 2, VH * 0.52, 14 * sc, '#ccc', 'center');
  txt('Lasso rivals to yank them off their rockets!', VW / 2, VH * 0.52 + 18 * sc, 14 * sc, '#ccc', 'center');
  txt('Hook two things, then TIE them: clotheslines, tie-ups!', VW / 2, VH * 0.52 + 36 * sc, 14 * sc, '#f93', 'center');
  txt(isTouch ? 'LEFT: steer   RIGHT: hold <L  R> cables + BOOST' : 'ARROWS/WASD steer  SHIFT/W boost  Q/E cables  T tie', VW / 2, VH * 0.52 + 58 * sc, 12 * sc, '#8ab', 'center');
  if (ALTITUDE_ENABLED) txt(isTouch ? 'UP / DN: altitude (cables reach 1 level; LOW fences only stop LOW)' : 'R / F: altitude (cables reach 1 level; LOW fences only stop LOW)', VW / 2, VH * 0.52 + 75 * sc, 12 * sc, '#b9a0ff', 'center');
  if (Math.floor(now / 500) % 2 === 0) txt(isTouch ? 'TAP TO START' : 'CLICK OR PRESS SPACE TO START', VW / 2, VH * 0.9, 22 * sc, '#fff', 'center');
}
function drawResults(now) {
  ctx.fillStyle = 'rgba(0,0,10,0.75)'; ctx.fillRect(0, 0, VW, VH);
  const sc = clamp(VH / 390, 0.8, 1.6);
  drawBigTitle('ROUND OVER', VW / 2, VH * 0.14, Math.min(VW / 10, 46 * sc));
  const place = results.indexOf(player) + 1;
  const tie = results.length > 1 && results[0].score === results[1].score && results[0].falls === results[1].falls && place <= 2;
  const ord = ['1ST', '2ND', '3RD', '4TH'][place - 1];
  txt(place === 1 && !tie ? 'YOU WIN!' : tie ? 'TIE FOR 1ST!' : 'YOU PLACED ' + ord, VW / 2, VH * 0.29, 22 * sc, place === 1 ? '#fc0' : '#fff', 'center');
  const cx = VW / 2, rowH = 26 * sc; let y = VH * 0.41;
  txt('RANK  RIDER   POINTS  FALLS', cx, y, 14 * sc, '#888', 'center'); y += rowH;
  results.forEach((r, i) => {
    const line = (i + 1) + '.    ' + (r.name + '      ').slice(0, 7) + '  ' + String(r.score).padStart(4) + '  ' + String(r.falls).padStart(5);
    txt(line, cx, y, 16 * sc, r.color, 'center'); y += rowH;
  });
  if (overT > 1.2 && Math.floor(now / 500) % 2 === 0) txt(isTouch ? 'TAP TO RESTART' : 'CLICK OR SPACE TO RESTART', VW / 2, VH * 0.9, 20 * sc, '#fff', 'center');
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
  const portrait = VH > VW;
  if (!portrait) {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; }
    if (n === 8) acc = 0;
  }
  render(now);
  requestAnimationFrame(frame);
}
resetWorld();
requestAnimationFrame(frame);

// debug/test hook
window.RJ = { get state() { return state; }, get riders() { return riders; }, get player() { return player; },
  get timeLeft() { return timeLeft; }, set timeLeft(v) { timeLeft = v; }, posts, tethers, knockOff, addTether, canTie, btns,
  get msgs() { return msgs.map(m => m.text); }, clearMsgs() { msgs.length = 0; }, fences, lvl, canReach, altOn: ALTITUDE_ENABLED, cam };
})();
</script>
