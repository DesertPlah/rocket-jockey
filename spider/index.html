function storeLegRest(mount) {
  const rest = {};
  mount.traverse(o => {
    if (/^leg_[LR][1-4]_(upper|lower)$/.test(o.name) || o.name === 'abdomen' || o.name === 'body' || o.name === 'palp_L' || o.name === 'palp_R') {
      rest[o.name] = { rx: o.rotation.x, ry: o.rotation.y, rz: o.rotation.z, y: o.position.y };
    }
  });
  mount.userData.legRest = rest;
  return rest;
}

function findLeg(mount, name) { return mount.getObjectByName(name); }

function poseLegs(r, dt) {
  const mount = r.mount; if (!mount) return;
  const rest = mount.userData.legRest || storeLegRest(mount);
  const spd = Math.hypot(r.vx, r.vz);
  const walking = spd > 0.4 && r.y < 0.2 && !r.hidden;
  if (walking) r.gaitT = (r.gaitT || 0) + dt * (5.5 + spd * 0.35);
  else if (!walking) r.gaitT = (r.gaitT || 0) + dt * 0.6;
  const stride = walking ? clamp(spd / 10, 0.25, 1) : (r.y > 0.2 ? 0.15 : 0.08);
  const tuck = r.y > 0.2 ? 0.35 : 0;
  const glbStyle = !!(mount.getObjectByName('leg_L1_hip') || r.mountSource === 'glb');
  // Alternating tetrapod: A = L1 R2 L3 R4, B = R1 L2 R3 L4
  const groupOf = n => (n === 'L1' || n === 'R2' || n === 'L3' || n === 'R4') ? 0 : Math.PI;
  for (const side of ['L', 'R']) for (let i = 1; i <= 4; i++) {
    const tag = side + i;
    const u = findLeg(mount, `leg_${tag}_upper`), l = findLeg(mount, `leg_${tag}_lower`);
    if (!u || !l) continue;
    const ur = rest[u.name] || { rx:0, ry:0, rz:0 }, lr = rest[l.name] || { rx:0, ry:0, rz:0 };
    const phase = (r.gaitT || 0) + groupOf(tag);
    const fwd = Math.sin(phase), liftAmt = Math.max(0, Math.cos(phase));
    const sideSign = side === 'L' ? 1 : -1;
    if (glbStyle) {
      // Modellie convention: +rotation.z raises a segment; hip yaw is static; animate relative to rest.
      const lift = liftAmt * 0.30 * (walking ? stride : 0.25) + tuck * 0.35;
      u.rotation.x = ur.rx;
      u.rotation.y = ur.ry + -sideSign * 0.24 * fwd * stride;
      u.rotation.z = ur.rz + lift;
      l.rotation.z = lr.rz - lift;
    } else {
      const swing = fwd * 0.32 * stride;
      const lift = liftAmt * 0.28 * stride;
      const idle = !walking ? Math.sin((r.gaitT || 0) * 0.8 + i) * 0.03 : 0;
      u.rotation.x = ur.rx + swing * 0.25 + idle;
      u.rotation.y = ur.ry + swing * sideSign * 0.15;
      u.rotation.z = ur.rz - lift - tuck;
      l.rotation.z = lr.rz + lift * 0.7 + tuck * 0.5;
    }
  }
  const abd = mount.getObjectByName('abdomen'), ar = rest.abdomen;
  if (abd && ar) {
    const t = r.gaitT || 0;
    abd.rotation.x = ar.rx + 0.05 * Math.sin(t * 2);
    abd.rotation.y = ar.ry + 0.04 * Math.sin(t);
    abd.rotation.z = ar.rz;
  }
  const body = mount.getObjectByName('body'), br = rest.body;
  if (body && br && walking) {
    body.position.y = br.y + 0.05 * Math.abs(Math.sin(r.gaitT || 0));
    body.rotation.z = 0.02 * Math.sin(r.gaitT || 0);
  } else if (body && br) { body.position.y = br.y; body.rotation.z = 0; }
  for (const pn of ['palp_L', 'palp_R']) {
    const pl = mount.getObjectByName(pn), pr = rest[pn];
    if (pl && pr) pl.rotation.x = pr.rx + 0.15 * Math.sin((r.gaitT || 0) * 2 + (pn === 'palp_R' ? 1.5 : 0));
  }
}

function tintTeamMaterial(root, hex) {
  root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m, i) => {
      if (m && m.name === 'team') {
        const c = m.clone(); c.name = 'team'; c.color = new THREE.Color(hex);
        if (Array.isArray(o.material)) o.material[i] = c; else o.material = c;
      }
    });
  });
}

function attachSaddleProp(r) {
  if (!props.saddle || !r.saddle) return;
  const old = r.saddle.getObjectByName('saddle_prop'); if (old) r.saddle.remove(old);
  const prop = props.saddle.scene.clone(true);
  prop.name = 'saddle_prop';
  tintTeamMaterial(prop, TEAMS[r.team].hex);
  prop.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  r.saddle.add(prop);
}

function bindMount(r, group, source) {
  if (r.mount) { if (r.jockey && r.jockey.parent) r.jockey.parent.remove(r.jockey); scene.remove(r.mount); }
  r.mount = group; r.mountSource = source;
  storeLegRest(group);
  r.saddle = group.getObjectByName('saddle') || group;
  r.spinneret = group.getObjectByName('spinneret') || null;
  r.head = group.getObjectByName('head') || null;
  scene.add(group);
  if (source === 'glb') attachSaddleProp(r);
  if (!r.jockey) r.jockey = makeJockey(r.name, r.team, TEAMS[r.team].hex);
  r.saddle.add(r.jockey);
  if (r.camoT > 0) applyCamo(r, true);
  syncMount(r);
}

async function tryLoadUrl(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('missing');
  const buf = await r.arrayBuffer();
  const base = url.slice(0, url.lastIndexOf('/') + 1);
  const loader = new GLTFLoaderCls();
  return await new Promise((res, rej) => loader.parse(buf, base, res, rej));
}

async function tryLoadGLB(id) {
  if (modelCache.has(id)) return modelCache.get(id);
  if (!GLTFLoaderCls) return 'missing'; // don't cache: loader may arrive a moment later
  loadsOpen++;
  try {
    for (const url of MODEL_PATHS(id)) {
      try { const gltf = await tryLoadUrl(url); modelCache.set(id, gltf); return gltf; }
      catch (_) { /* try next path */ }
    }
    modelCache.set(id, 'missing'); return 'missing';
  } finally { loadsOpen--; }
}

async function tryLoadProp(name) {
  if (props[name]) return props[name];
  if (!GLTFLoaderCls) return null;
  loadsOpen++;
  try {
    for (const url of [`models/${name}.glb`, `../models/spider-jockey/${name}.glb`]) {
      try { const gltf = await tryLoadUrl(url); props[name] = gltf; return gltf; }
      catch (_) {}
    }
    return null;
  } finally { loadsOpen--; }
}

async function ensureMount(r, spec) {
  r.spec = spec;
  const gltf = await tryLoadGLB(spec);
  if (gltf && gltf !== 'missing' && gltf.scene) {
    const clone = gltf.scene.clone(true);
    clone.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
    bindMount(r, clone, 'glb');
  } else {
    bindMount(r, makeProceduralSpider(spec), 'proc');
  }
}

async function loadAllProps() {
  await Promise.all(PROP_IDS.map(tryLoadProp));
  for (const r of riders) if (r.mountSource === 'glb') attachSaddleProp(r);
}

function syncMount(r) {
  if (!r.mount) return;
  r.mount.position.set(r.x, r.y + (r._burrowY || 0), r.z);
  r.mount.rotation.order = 'YXZ';
  r.mount.rotation.y = r.h;
  const bank = clamp(-r.steerVis * 0.25, -0.25, 0.25);
  r.mount.rotation.z = bank;
  r.mount.rotation.x = r.y > 0.15 ? -0.15 : 0;
}

    silks: [newSilk(), newSilk()], pts: 0, ko: 0, lastTouch: 0,

let silkWas = [false, false];
function collectPlayerInput() {
  if (!player) return;
  const keySteer = (keys.KeyA || keys.ArrowLeft ? -1 : 0) + (keys.KeyD || keys.ArrowRight ? 1 : 0);
  const keyThr = (keys.KeyW || keys.ArrowUp ? 1 : 0) + (keys.KeyS || keys.ArrowDown ? -0.55 : 0);
  const stickSteer = inp.stickX;
  const stickThr = inp.stickY;
  let steer = clamp(keySteer + stickSteer, -1, 1);
  let throttle = 0;
  if (keyThr || Math.abs(stickThr) > 0.18) throttle = clamp(keyThr + stickThr, -0.55, 1);
  else if (Math.abs(steer) > 0.15 && TOUCH && LAY === 'CLASSIC') throttle = 0.7; // classic: dragging also walks
  // desktop default: if steering with no throttle, turn in place; W to walk. Also allow always-creep? no.
  player.steer = steer; player.throttle = throttle;
  player.boost = !!(keys.ShiftLeft || keys.ShiftRight || inp.boostT || inp.gBoost);
  const silkL = !!(keys.KeyQ || inp.cabL || inp.mouseL || inp.gL);
  const silkR = !!(keys.KeyE || inp.cabR || inp.mouseR || inp.gR);
  for (const [i, down] of [[0, silkL], [1, silkR]]) {
    if (down && !silkWas[i]) retractOrFire(player, i);
    if (!down && silkWas[i] && player.silks[i].st === 'held') releaseSilk(player, i);
    if (!down && silkWas[i] && player.silks[i].st === 'fly') { /* hold to keep flying; release starts retract after a miss? keep flying until life */ }
    silkWas[i] = down;
  }
  if (abQ || inp.abT && !player._abHeld) { fireAbility(player); abQ = false; player._abHeld = true; }
  if (!inp.abT && !keys.Space && !keys.KeyF) player._abHeld = false;
  abQ = false;
}

function makeProceduralWanda() {

  const abd = new THREE.Mesh(new THREE.SphereGeometry(0.38, 10, 8), cream); abd.name = 'abdomen'; abd.position.set(0, 0.62, -0.38); abd.scale.set(0.9, 0.8, 1.1); body.add(abd);

  const es = new THREE.Group(); es.name = 'eyes_small'; head.add(es);
  const fangs = new THREE.Group(); fangs.name = 'fangs'; fangs.position.set(0, -0.06, 0.28); head.add(fangs);
  fangs.add(new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.12, 5), M(0xa8f0d8)));
  for (const [n, x] of [['palp_L', -0.14], ['palp_R', 0.14]]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.22, 5), fur); p.name = n; p.rotation.z = x > 0 ? -0.5 : 0.5; p.position.set(x, 0.02, 0.22); head.add(p);
  }

  const band = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.03, 5, 10), M(0x222028)); band.rotation.x = 1.2; acc.add(band);
  const mic = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 4), M(0xff6aa8)); mic.position.set(0.2, -0.08, 0.1); acc.add(mic);
  for (const side of ['L', 'R']) for (const i of [1, 2, 3, 4]) {
    const hip = new THREE.Group(); hip.name = 'leg_' + side + i + '_hip';
    hip.position.set(side === 'L' ? 0.22 : -0.22, 0.55, 0.15 - (i - 1) * 0.16);
    hip.rotation.y = (side === 'L' ? 1 : -1) * (0.5 + i * 0.15);

    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.02, 0.36, 5), fur); l.name = 'leg_' + side + i + '_lower'; l.rotation.z = -0.5; l.position.set(0.16, -0.16, 0); u.add(l);

function wandaRig(root) {
  const g = n => root.getObjectByName(n);
  const W = { root, body: g('body'), head: g('head'), abd: g('abdomen'), fangs: g('fangs'), look: g('look_target'),
    eyes: ['L', 'R'].map(s => ({ e: g('eye_' + s), gl: g('eye_' + s + '_glint') })).filter(o => o.e),
    palps: ['L', 'R'].map(s => g('palp_' + s)).filter(Boolean),
    legs: ['L1', 'R1'].map(s => ({ u: g('leg_' + s + '_upper'), l: g('leg_' + s + '_lower') })).filter(o => o.u) };
  W.rest = new Map(); root.traverse(o => W.rest.set(o, { r: o.rotation.clone(), p: o.position.clone() }));
  W.lt0 = W.look ? W.look.position.clone() : new THREE.Vector3(0, 1, 2);
  return W;
}
function wandaReset(W) { if (!W) return; for (const [o, v] of W.rest) { o.rotation.copy(v.r); o.position.copy(v.p); } }
function wandaWave(W, a = 0.52) {
  if (!W) return;
  for (const p of W.palps) p.rotation.z += a;
  for (const L of W.legs) { if (L.u) L.u.rotation.z += a; if (L.l) L.l.rotation.z -= a * 0.35; }
}
function aimWandaEyes(W) {
  if (!W) return;
  for (const { e, gl } of W.eyes) {
    e.quaternion.identity(); e.updateWorldMatrix(true, false);
    if (W.look) { W.look.getWorldPosition(_wV); e.worldToLocal(_wV); } else _wV.set(0, 0, 1);
    if (_wV.lengthSq() < 1e-8) continue;
    _wV.normalize();
    _wQ.setFromUnitVectors(_wFwd, _wV);
    const ang = 2 * Math.acos(Math.min(1, Math.abs(_wQ.w)));
    if (ang > 0.6) _wQ.slerp(new THREE.Quaternion(), 1 - 0.6 / ang);
    e.quaternion.copy(_wQ);
    if (gl) gl.quaternion.copy(_wQ).invert();
  }
}
function poseWanda(dt) {
  if (!wandaW) return;
  wandaClock += dt;
  const t = wandaClock, W = wandaW;
  wandaReset(W);
  if (W.look) W.look.position.set(W.lt0.x + Math.sin(t * 0.35) * 1.4, W.lt0.y + Math.sin(t * 0.5) * 0.4, W.lt0.z);
  for (const [i, p] of W.palps.entries()) p.rotation.z += 0.18 + 0.2 * Math.sin(t * 1.3 + i * 1.7);
  if (W.fangs) {
    const talk = (wandaTalk || wandaIntro) ? 1 : 0.25;
    W.fangs.rotation.x += 0.08 * Math.max(0, Math.sin(t * 9)) * (Math.sin(t * 0.7) > 0 ? talk : 0);
  }
  if (W.abd) W.abd.rotation.x += 0.05 * Math.sin(t * 1.6);
  if (W.head) W.head.rotation.z += 0.06 * Math.sin(t * 0.45);
  const cyc = t % 8;
  if (W.legs[1]) {
    if (cyc < 1.2) { const k = Math.sin(cyc / 1.2 * Math.PI); W.legs[1].u.rotation.z += 0.6 * k; if (W.legs[1].l) W.legs[1].l.rotation.z -= 0.2 * k + 0.25 * k * Math.sin(cyc * 14); }
  }
  if (W.legs[0] && wandaIntro && cyc >= 1.2 && cyc < 2.6) {
    const k = Math.sin((cyc - 1.2) / 1.4 * Math.PI); W.legs[0].u.rotation.z += 0.55 * k;
  }
  if (cyc > 4 && cyc < 4.6 && W.body) {
    const k = Math.sin((cyc - 4) / 0.6 * Math.PI); W.body.position.y += 0.35 * k;
    for (const L of W.legs) L.u.rotation.z -= 0.2 * k;
  }

  aimWandaEyes(W);
}
function frameWanda(mode) {

  const c = box.getCenter(new THREE.Vector3());

  const hp = h ? h.getWorldPosition(new THREE.Vector3()) : c.clone();
  const portrait = mode === 'portrait' || mode === 'intro';
  const tgt = portrait ? hp.clone().add(new THREE.Vector3(0, -0.12, 0.3)) : c.clone();
  const off = portrait ? new THREE.Vector3(0.5, 0.3, 2.5) : new THREE.Vector3(1.5, 1.1, 2.6);

function sizeWandaCanvas() {

async function loadWanda() {

function assignAISpecies(youSpec) {
  const leftover = SPEC_IDS.filter(id => id !== youSpec);
  // prefer flavorful defaults, then fill
  const prefer = { GOLD: 'wolf', RED: 'tarantula', VIOLET: 'widow' }; // leftovers include the four new mounts
  const used = new Set([youSpec]), out = {};
  for (const n of ['GOLD', 'RED', 'VIOLET']) {
    const p = prefer[n];
    out[n] = (!used.has(p) ? p : leftover.find(id => !used.has(id))) || leftover[0];
    used.add(out[n]);
  }
  return out;
}

function spawnRiders(youSpec) {
  for (const r of riders) {
    for (const c of r.silks) disposeSilk(c);
    if (r.cocoons) for (const c of r.cocoons) if (c.mesh.parent) c.mesh.parent.remove(c.mesh);
    if (r.mount) scene.remove(r.mount);
  }
  riders.length = 0;
  const aiSpec = assignAISpecies(youSpec);
  player = addRider('YOU', 0, youSpec, -8, -22, 0);
  gold = addRider('GOLD', 0, aiSpec.GOLD, 8, -22, 0);
  red = addRider('RED', 1, aiSpec.RED, 8, 22, Math.PI);
  violet = addRider('VIOLET', 1, aiSpec.VIOLET, -8, 22, Math.PI);
}

    <div class="lays rrow">${RLENS.map(v => `<button data-r="${v}" class="${v === RLEN ? 'sel' : ''}">${v === 'free' ? 'Free play' : v + ' min'}</button>`).join('')}</div>
    <ul><li>WASD / arrows or the left stick: turn and walk. Shift or BOOST to sprint.</li><li>Q / E, mouse buttons, or SILK: fire, hold to keep a snag, tap again to let go.</li><li>Space / F or ABILITY: your mount’s one trick.</li></ul>
    <div class="btns"><button class="go" id="pzGo">RESUME</button><button class="go alt" id="pzEnd">END ROUND</button><button class="go alt" id="pzHelp">❓ CONTROLS</button><button class="go alt" id="pzPick">MOUNTS</button></div>`);
  for (const b of document.querySelectorAll('#ovl [data-l]')) b.addEventListener('click', () => setLayout(b.dataset.l));
  for (const b of document.querySelectorAll('#ovl [data-r]')) b.addEventListener('click', () => { RLEN = b.dataset.r; localStorage.setItem('sj_rlen', RLEN); showPause(); });
  $('pzGo').addEventListener('click', () => closeOvl());
  $('pzEnd').addEventListener('click', () => { closeOvl(); endRound('quit'); });
  $('pzHelp').addEventListener('click', () => showHelp('pause'));
  $('pzPick').addEventListener('click', () => showPick());
}

function showHelp(back) {
  helpBack = back || null;
  const touch = {
    CLASSIC: ['Left half: drag sideways to steer (and walk). ABILITY button on the left.', 'Right: BOOST, ◀ SILK / SILK ▶ (hold to keep a snag, tap again to let go).'],
    HYBRID: ['Left thumb: a stick appears where you touch. ◀ ▶ steer, push ▲ to walk, ▼ to back up.', 'Right thumb: ◀ SILK / SILK ▶ and BOOST. Left-side ABILITY button uses your mount’s trick.'],
    GESTURE: ['Left thumb: the same stick (steer + walk).', 'Right half: two invisible silk zones. Hold to keep a snag, touch again to let go. Flick up ▲ = BOOST. Lower-left dashed zone = ABILITY.']
  };
  openOvl('help', `<h2>Controls</h2>
    <div class="lays">${LAYOUTS.map(l => `<button data-hl="${l}" class="${l === LAY ? 'sel' : ''}">${l}</button>`).join('')}</div>
    <table class="hk"><tr><th>Walk / turn</th><td>W A S D or arrow keys, or the left stick</td></tr>
    <tr><th>Sprint</th><td>Shift, or BOOST</td></tr>
    <tr><th>Silk</th><td>Q / E, or left / right mouse, or the SILK buttons. Hold to keep a snag on the ball or a rival. Tap again (or release a held snag) to let go and fling.</td></tr>
    <tr><th>Ability</th><td>Space or F, or the ABILITY button — hop, sprint, hair-kick, slow bite, or web trap, depending on your mount.</td></tr>
    <tr><th>Pause / help</th><td>P or Esc to pause, H for this card.</td></tr></table>
    <div class="sub">Touch — ${LAY}</div>
    <ul class="hul">${touch[LAY].map(t => `<li>${t}</li>`).join('')}</ul>
    <p class="sub">Silkball: you and GOLD attack the far (red) goal. Snag the ball with silk or bump it in. First to more goals when time runs out.</p>
    <div class="btns"><button class="go" id="hlGo">${helpBack ? 'BACK' : 'GOT IT'}</button></div>`);
  for (const b of document.querySelectorAll('#ovl [data-hl]')) b.addEventListener('click', () => { setLayout(b.dataset.hl); showHelp(helpBack); });
  $('hlGo').addEventListener('click', () => { if (helpBack === 'pause') showPause(); else if (helpBack === 'pick') showPick(); else closeOvl(); });
}

// ---------------- main loop ----------------
function sim(dt) {
  dt = Math.min(0.05, Math.max(0, dt));
  if (screen !== 'play' || !RND) return;
  if (RND.st === 'count') {
    RND.count -= dt;
    const n = Math.ceil(RND.count);
    $('rcount').style.display = 'block';
    $('rcount').textContent = n > 0 ? String(n) : 'GO';
    if (RND.count <= 0) { RND.st = 'live'; $('rcount').style.display = 'none'; flash('GO!', '#7dff8a'); }
    // still pose idle
    for (const r of riders) { poseLegs(r, dt); syncMount(r); }
    stepCamera(dt); return;
  }
  if (RND.st !== 'live') { stepCamera(dt); return; }
  RND.t += dt;
  if (RND.len) { RND.left = Math.max(0, RND.len - RND.t); $('rtime').textContent = fmtT(RND.left); $('rtime').classList.toggle('low', RND.left <= 15); if (RND.left <= 0) { endRound('time'); return; } }
  else $('rtime').textContent = fmtT(RND.t);

  if (!ovlMode) collectPlayerInput();
  else if (player) { player.throttle = 0; player.steer = 0; player.boost = false; }

  dispCool -= dt;
  if (dispCool <= 0 && balls.length < T.MAX_BALLS) { spawnBall(rand(-1, 1), rand(-1, 1), 0, 0); dispCool = 99; }

  for (const r of riders) { if (r.ai) aiThink(r, dt); stepRider(r, dt); }
  separateRiders(dt);
  for (const b of [...balls]) { for (const r of riders) bumpBall(r, b); stepBall(b, dt); }
  stepWebs(dt); stepBursts(dt); stepCocoons(dt); stepCamera(dt); updAbHint();
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').style.opacity = 0; }
}

let acc = 0, lastT = performance.now(), fpsT = 0, fpsN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const raw = Math.min(0.08, (now - lastT) / 1000); lastT = now;
  const running = screen === 'play' && RND && (RND.st === 'live' || RND.st === 'count') && !ovlMode;
  if (running) {
    acc += raw; const stepDt = 1 / 60; let n = 0;
    while (acc >= stepDt && n < 5) { sim(stepDt); simTime += stepDt; acc -= stepDt; n++; }
  } else acc = 0;
  if (ovlMode === 'intro') { introLeft -= raw; if (introLeft <= 0) skipIntro(); }
  if (screen === 'play' && riders.length) { for (const r of riders) syncMount(r); }
  renderer.render(scene, camera); tickWanda(raw); frames++;
  fpsN++; fpsT += raw; if (fpsT >= 0.5) { $('fps').textContent = Math.round(fpsN / fpsT) + ' fps'; fpsN = 0; fpsT = 0; }
}

function applyTestInputs(o) {
  if (!o || !player) return;
  if (o.steer != null) player.steer = o.steer;
  if (o.throttle != null) player.throttle = o.throttle;
  if (o.boost != null) player.boost = !!o.boost;
  if (o.heading != null) player.h = o.heading;
  if (o.silkL) retractOrFire(player, 0);
  if (o.silkR) retractOrFire(player, 1);
  if (o.releaseL) releaseSilk(player, 0);
  if (o.releaseR) releaseSilk(player, 1);
  if (o.ability) fireAbility(player);
}

function hookState() {
  const pack = r => r && ({ name: r.name, spec: r.spec, team: r.team, x: r.x, y: r.y, z: r.z, h: r.h, vx: r.vx, vy: r.vy, vz: r.vz, spd: r.spd, cool: r.cool, stun: r.stun, slowT: r.slowT, sprintT: r.sprintT, air: !!r.air, hidden: !!r.hidden, camoT: r.camoT, burrowT: r.burrowT, dashT: r.dashT, lungeT: r.lungeT, cocoons: (r.cocoons || []).length, knockT: r.knockT || 0, mount: r.mountSource, silk: r.silks.map(c => ({ st: c.st, kind: c.kind, x: c.x, y: c.y, z: c.z })), pts: r.pts, brain: r.ai ? r.brain.why : null });
  return {
    version: VERSION, frames, t: simTime, screen, ovl: ovlMode, mode: 'silkball',
    species: player && player.spec, score: teamGoals.slice(),
    you: pack(player), ai: riders.filter(r => r.ai).map(pack),
    riders: riders.map(pack),
    balls: balls.map(b => ({ id: b.id, x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz, last: b.last && b.last.name })),
    webs: webs.map(w => ({ x: w.x, z: w.z, r: w.r, life: w.life, team: w.team, kind: w.kind })),
    webPatch: WEB_PATCH, loading: loadsOpen,
    wanda: { open: ovlMode === 'wanda', intro: ovlMode === 'intro', fact: lastFact && lastFact.text, id: lastFact && lastFact.id, ready: wandaReady, source: wandaSource, view: wandaView, host: true },
    rnd: RND && { st: RND.st, t: RND.t, left: RND.left, len: RND.len, why: RND.why },
    stats: { ...stats },
    nan: riders.some(r => [r.x, r.y, r.z, r.vx, r.vy, r.vz].some(n => !Number.isFinite(n))) || balls.some(b => [b.x, b.y, b.z, b.vx, b.vy, b.vz].some(n => !Number.isFinite(n)))
  };
}

function hookStep(dt, inputs, opts) {
  const prevOvl = ovlMode, prevScreen = screen;
  if (inputs) { if (ovlMode && inputs.force) closeOvl(); applyTestInputs(inputs); }
  // tests drive the sim even if the rAF loop is paused behind an overlay, unless still on pick
  if (screen === 'play' && RND) {
    const hold = ovlMode; ovlMode = null; // skip collectPlayerInput; test inputs already applied
    const st = RND.st;
    if (st === 'count' || st === 'live') {
      // call sim but skip collectPlayerInput by faking overlay then restoring after collect — cleaner: direct
      if (RND.st === 'count') {
        RND.count -= dt;
        if (RND.count <= 0) { RND.st = 'live'; $('rcount').style.display = 'none'; }
      } else if (RND.st === 'live') {
        RND.t += dt;
        if (RND.len) { RND.left = Math.max(0, RND.len - RND.t); if (RND.left <= 0) endRound('time'); }
        if (RND.st === 'live') {
          dispCool -= dt;
          if (dispCool <= 0 && balls.length < T.MAX_BALLS) { spawnBall(0, 0, 0, 0); dispCool = 99; }
          for (const r of riders) { if (r.ai) aiThink(r, dt); stepRider(r, dt); }
          separateRiders(dt);
          for (const b of [...balls]) { for (const q of riders) bumpBall(q, b); stepBall(b, dt); }
          stepWebs(dt); stepBursts(dt); stepCocoons(dt);
        }
      }
    }
    if (ovlMode == null) ovlMode = hold;
    stepCamera(dt); updAbHint(); updScore();
  }
  if (!opts || opts.draw !== false) { renderer.render(scene, camera); tickWanda(dt); } frames++; simTime += dt;
  return hookState();
}

const hook = {
  version: VERSION, mode: 'silkball',
  state: hookState,
  step: hookStep,
  frames: () => frames,
  freezeAI(on) { aiFrozen = on !== false; for (const r of riders) if (r.ai) { r.throttle = 0; r.steer = 0; r.boost = false; r.brain.cool = on ? 1e9 : 0.2; } },
  setPlayer(x, z, h, y) { if (!player) return; if (x != null) player.x = x; if (z != null) player.z = z; if (h != null) player.h = h; if (y != null) player.y = y; player.vx = player.vz = 0; syncMount(player); },
  playerSpeed(v) { if (!player) return; const f = fwd(player); player.vx = f.x * v; player.vz = f.z * v; player.spd = v; },
  placeAI(i, x, z, h) { const a = riders.filter(r => r.ai)[i]; if (!a) return; a.x = x; a.z = z; if (h != null) a.h = h; a.vx = a.vz = 0; syncMount(a); },
  speedAI(i, v) { const a = riders.filter(r => r.ai)[i]; if (!a) return; const f = fwd(a); a.vx = f.x * v; a.vz = f.z * v; },
  setSpecies(name, id) { const r = riders.find(q => q.name === name); id = resolveSpec(id) || id; if (!r || !SPECIES[id]) return false; r.spec = id; r.cool = 0; r.hidden = false; r.camoT = 0; r.burrowT = 0; r._burrowY = 0; r.dashT = 0; r.lungeT = 0; bindMount(r, makeProceduralSpider(id), 'proc'); ensureMount(r, id); return true; },
  fireAbility(name) { const r = name ? riders.find(q => q.name === name) : player; if (!r) return false; r.cool = 0; const prev = screen, st = RND && RND.st; screen = 'play'; if (RND) RND.st = 'live'; const out = fireAbility(r); screen = prev; if (RND) RND.st = st; return out; },
  fireSilk(name, i) { const r = name ? riders.find(q => q.name === name) : player; return r ? fireSilk(r, i || 0) : false; },
  releaseSilk(name, i) { const r = name ? riders.find(q => q.name === name) : player; if (r) releaseSilk(r, i || 0); },
  spawnBall(x, z, vx, vz) { return spawnBall(x, z, vx, vz) && hookState().balls.slice(-1)[0]; },
  clearBalls, clearWebs,
  holdDisp() { dispCool = 99; },
  newRound: (k) => newRound(!!k),
  skipCount, endRound, skipWanda: () => { if (ovlMode === 'wanda') closeOvl(); },
  skipIntro,
  showPick, showWanda, showHelp, showPause, closeOvl, ovlMode: () => ovlMode,
  start(spec) { if (spec) { pickChoice.spec = resolveSpec(spec) || spec; } newRound(false); skipCount(); },
  setTimeLeft(s) { if (!RND) return; if (!RND.len) RND.len = s; RND.left = s; if (RND.len < s) RND.len = s; RND.t = RND.len - s; },
  setRLen(v) { RLEN = String(v); },
  youAI(on) { if (!player) return; player.ai = !!on; if (on) player.brain.cool = 0.1; },
  loading: () => loadsOpen,
  wandaReady: () => wandaReady,
  wandaSource: () => wandaSource,
  wandaView: () => wandaView,
  webPatch: () => WEB_PATCH,
  propsReady: () => PROP_IDS.filter(n => !!props[n]),
  layout: () => LAY, setLayout, diff: () => diff,
  facts: () => WANDA_FACTS.map(f => f.id), lastFact: () => lastFact,
  species: () => SPEC_IDS, help: () => ({ open: ovlMode === 'help', text: ovlMode === 'help' ? $('ovl').innerText : '', lay: LAY, back: helpBack }),
  pickOf: () => pickChoice.spec,
  renderer: () => { const gl = renderer.getContext(); const ext = gl && gl.getExtension('WEBGL_debug_renderer_info'); return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'unknown'; }
};
hook.helpDone = () => { if (ovlMode === 'help') closeOvl(); };
window.__game = hook; window.__sj = hook;

// ---------------- boot ----------------
applyQuality(); applyLayout(); resize();
import('three/addons/loaders/GLTFLoader.js').then(async m => {
  GLTFLoaderCls = m.GLTFLoader;
  await loadAllProps();
  await loadWanda();
  for (const r of riders) await ensureMount(r, r.spec);
}).catch(() => {});
if (skipTut) { newRound(false); skipCount(); } else showPick();
requestAnimationFrame(loop);
</script>
</body></html>
